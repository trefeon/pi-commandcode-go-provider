name: Auto-Sync Upstream Models

on:
  schedule:
    # Run daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Regenerate Go-plan catalog
        run: bun run scripts/generate-catalog.ts

      - name: Commit and push changes if modified
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n $(git status -s) ]]; then
            git add src/generated-catalog.ts
            git commit -m "chore(models): sync Go-plan catalog from upstream [skip ci]"
            git push
          else
            echo "Catalog is already up to date."
          fi
